server:
  port: 8080
spring:
  application:
    name: edge-router
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-1234567890}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
